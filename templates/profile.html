{% extends "base.html" %}

{% block title %}My Account — KurnoolHub{% endblock %}

{% block content %}

<section class="page-head">

    <div class="welcome">
        MY ACCOUNT
    </div>

    <h1>
        Welcome, <span>{{ user.name }}</span>
    </h1>

    <p>
        Manage your KurnoolHub account.
    </p>

</section>


<section class="section">

    <div
        style="
            max-width:600px;
            margin:0 auto;
        "
    >

        <!-- USER INFORMATION -->

        <div
            style="
                background:#fff;
                border:1px solid #e1e5e8;
                border-radius:16px;
                padding:30px;
                box-shadow:0 10px 30px rgba(20,30,40,.08);
                margin-bottom:20px;
            "
        >

            <h2 style="margin-top:0;">
                Account Information
            </h2>


            <div style="margin-top:25px;">

                <p>
                    <strong>Name</strong>
                </p>

                <p>
                    {{ user.name }}
                </p>

            </div>


            <div style="margin-top:20px;">

                <p>
                    <strong>Email</strong>
                </p>

                <p>
                    {{ user.email }}
                </p>

            </div>

        </div>


        <!-- ACCOUNT ACTIONS -->

        <div
            style="
                background:#fff;
                border:1px solid #e1e5e8;
                border-radius:16px;
                padding:25px 30px;
                box-shadow:0 10px 30px rgba(20,30,40,.08);
            "
        >

            <h3>
                Account
            </h3>


            <a
                href="/favorites"
                style="
                    display:block;
                    padding:14px 0;
                    color:inherit;
                    text-decoration:none;
                    border-bottom:1px solid #eee;
                    font-weight:600;
                "
            >
                ❤️ My Favorites
            </a>


            <a
                href="/logout"
                style="
                    display:block;
                    padding:14px 0;
                    color:#d9534f;
                    text-decoration:none;
                    font-weight:600;
                "
            >
                🚪 Logout
            </a>

        </div>

    </div>

</section>

{% endblock %}
