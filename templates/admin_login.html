{% extends "base.html" %}

{% block title %}Admin Login — KurnoolHub{% endblock %}

{% block content %}

<section class="admin-login-page">
    <div class="admin-login-card">

        <div class="admin-login-header">
            <span class="admin-badge">Admin</span>
            <h1>Admin login</h1>
            <p>Sign in to manage KurnoolHub.</p>
        </div>

        <form method="POST">

            <div class="field">
                <label for="email">Admin email</label>
                <input type="email" id="email" name="email" placeholder="Enter admin email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Login to dashboard</button>
        </form>

        <a class="admin-back-link" href="/">← Back to website</a>

    </div>
</section>

{% endblock %}
