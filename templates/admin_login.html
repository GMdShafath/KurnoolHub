{% extends "base.html" %}

{% block title %}Admin Login — KurnoolHub{% endblock %}

{% block content %}

<section class="admin-login-page">

    <div class="admin-login-card">

        <div class="admin-login-header">

            <div class="admin-badge">
                ADMIN
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Sign in to manage KurnoolHub.
            </p>

        </div>


        <form method="POST">

            <div class="admin-form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="admin-login-button"
            >
                Sign In
            </button>

        </form>


        <a
            href="/"
            class="admin-back-link"
        >
            ← Back to KurnoolHub
        </a>

    </div>

</section>

{% endblock %}
