{% extends "base.html" %}

{% block title %}Register — KurnoolHub{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-card">

        <span class="logo-mark">K</span>
        <h1>Create your <span>account</span></h1>
        <p class="sub">Join KurnoolHub to save businesses and share reviews.</p>

        <form method="POST" action="/register">

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>

    </div>
</section>

{% endblock %}
