{% extends "base.html" %}

{% block title %}List Your Business — KurnoolHub{% endblock %}

{% block content %}

<section class="page-head">

    <div class="welcome">
        FOR LOCAL BUSINESS OWNERS
    </div>

    <h1>
        List Your Business
    </h1>

    <p>
        Add your business to KurnoolHub and reach more local customers.
    </p>

</section>


<section class="section">

    <div class="business-form-container">

        <form method="POST">

            <div class="form-group">
                <label>Business Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter business name"
                    required
                >
            </div>


            <div class="form-group">

                <label>Category</label>

                <select name="category_id" required>

                    <option value="">
                        Select Category
                    </option>

                    {% for c in categories %}

                    <option value="{{ c.id }}">
                        {{ c.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Describe your business"
                    rows="5"
                ></textarea>

            </div>


            <div class="form-group">

                <label>Address</label>

                <input
                    type="text"
                    name="address"
                    placeholder="Enter business address"
                >

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                >

            </div>


            <div class="form-group">

                <label>Business Image</label>

                <input
                    type="text"
                    name="image"
                    placeholder="Example: pista_house.png"
                >

                <small>
                    Add the image filename from static/images/
                </small>

            </div>


            <button
                type="submit"
                class="form-submit"
            >
                Submit Business →
            </button>

        </form>

    </div>

</section>

{% endblock %}
